version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ludwigone-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ludwigone}
      POSTGRES_USER: ${POSTGRES_USER:-ludwigone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ludwigone}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ludwigone-network

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: ludwigone-temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-ludwigone}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ludwigone-network

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: ludwigone-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - ludwigone-network

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ludwigone-api
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ludwigone}
      DB_USER: ${POSTGRES_USER:-ludwigone}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # Temporal
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}

      # API
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}

      # JWT Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}

      # Mistral
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.ionos.de}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL}

      # Ollama
      USE_OLLAMA: ${USE_OLLAMA:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}

      # Application
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-500}
      OUTPUT_RETENTION_DAYS: ${OUTPUT_RETENTION_DAYS:-7}
      MAX_CONCURRENT_VISION_CALLS: ${MAX_CONCURRENT_VISION_CALLS:-5}
      VISION_API_TIMEOUT_SECONDS: ${VISION_API_TIMEOUT_SECONDS:-300}
      VISION_API_MAX_RETRIES: ${VISION_API_MAX_RETRIES:-5}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - api_uploads:/app/uploads
      - api_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ludwigone-network

  # Temporal Workers (2 replicas)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ludwigone}
      DB_USER: ${POSTGRES_USER:-ludwigone}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # Temporal
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}

      # API (needed for config)
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}

      # Mistral
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.ionos.de}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL}

      # Ollama
      USE_OLLAMA: ${USE_OLLAMA:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}

      # Application
      MAX_CONCURRENT_VISION_CALLS: ${MAX_CONCURRENT_VISION_CALLS:-5}
      VISION_API_TIMEOUT_SECONDS: ${VISION_API_TIMEOUT_SECONDS:-300}
      VISION_API_MAX_RETRIES: ${VISION_API_MAX_RETRIES:-5}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/app:/app/app
      - worker_temp:/app/temp
      - worker_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - ludwigone-network

  # User Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: ludwigone-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - ludwigone-network

  # Admin Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: ludwigone-dashboard
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - ludwigone-network

  # Ollama (Optional - use profile)
  ollama:
    image: ollama/ollama:latest
    container_name: ludwigone-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama
    networks:
      - ludwigone-network

volumes:
  postgres_data:
  api_uploads:
  api_outputs:
  worker_temp:
  worker_outputs:
  ollama_data:

networks:
  ludwigone-network:
    driver: bridge
